[package]
name = "konstruct"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "The native core of Konstruct: graph traversal, name resolution, search, formula identity and topic routing"
publish = false
# The crate shares the repository root with the Python package; only these belong to it.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/src/**",
    "/tests/*.rs",
    "/tests/fixtures/blake2b-kat.txt",
    "/benches/*.rs",
]

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true }
# `konstruct serve`: HTTP/1.1 on tokio, the API's JSON with serde_json, and its encodings made
# once per graph version. It checks graph.json with the core's own reader (src/json, src/load).
brotli = { version = "9.1.1", default-features = false, features = ["std"] }
bytes = "1.12.1"
flate2 = "1.1.11"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "server-graceful", "tokio"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# Linear-time matching for the routing expressions in Kafka Connect configuration (src/route.rs).
regex = "1.13.1"
# Its parser, to refuse Java's possessive repeats (a*+), which regex reads as a repeat of a repeat.
regex-syntax = "0.8.11"

[features]
# The Python extension module, built by maturin. abi3 makes one wheel per platform serve every
# Python from 3.11.
python = ["dep:pyo3", "pyo3/abi3-py311"]

[dev-dependencies]
proptest = "1.12.0"

# Timings of the indexes on a generated project: `cargo bench --bench core`.
[[bench]]
name = "core"
harness = false
