[package]
name = "konstruct"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "The native core of Konstruct: graph traversal, name resolution and search"
publish = false
# The crate shares the repository root with the Python package; only these are Rust.
include = ["/Cargo.toml", "/Cargo.lock", "/src/**", "/tests/*.rs"]

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true }

[features]
# The Python extension module, built by maturin. abi3 makes one wheel per platform serve every
# Python from 3.11.
python = ["dep:pyo3", "pyo3/abi3-py311"]

[dev-dependencies]
proptest = "1.12.0"
