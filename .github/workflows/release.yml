name: Create Release

# Runs after Build and Test passes on a push to main. main is protected, so nothing here pushes to
# it: a release is a tag on the tested commit, or on a commit above it, and a GitHub release.
#
# - When the tested commit carries a version with no tag (a pull request ran
#   .kodex/scripts/prepare_release.py), that commit is tagged and released.
# - Otherwise, when main has releasable commits since the last tag (a Dependabot fix, or a pull
#   request merged without preparing a release), the script writes the next version and changelog
#   section on a detached commit above main, and that commit is tagged and released.
# - A release left half done (its tag pushed but no GitHub release) is finished first.
#
# While the version is 0.x a release is a patch unless a change is marked breaking, which gives
# the next minor. Any version outside 0.x is refused: moving to 1.0 is the owner's decision, made
# by changing this workflow. Each release moves the v0 tag that action users pin and publishes the
# changelog section and the sdist; the wheels job then builds a wheel for each platform from the
# tag and attaches them.
#
# Each release also carries a CycloneDX SBOM of the locked dependencies, and a signed SLSA build
# provenance attestation (a Sigstore bundle, also recorded with GitHub's artifact attestations)
# for the sdist, the SBOM and the wheels; `gh attestation verify <file> -R kodexlabsio/konstruct`
# checks one.
#
# Publishing to PyPI is a separate job that stays off until the PUBLISH_TO_PYPI repository
# variable is 'true' and a 'pypi' environment with trusted publishing exists.
#
# workflow_run is safe here: the job runs only for a push to main (never for a pull request, whose
# head branch could also be called main), checks out main rather than anything from the triggering
# run, and releases only the commit that was tested.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_FROZEN: '1'

jobs:
  release:
    name: Create Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the release and v0 tags, and create the GitHub release
      id-token: write # sign the build provenance with the workflow's identity
      attestations: write # record the provenance with GitHub's artifact attestations
    outputs:
      released: ${{ steps.plan.outputs.released }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      # The tags are pushed with the checkout's credentials. The only artifact uploaded is dist/,
      # never the clone.
      - name: Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Release only the commit that was tested
        id: current
        if: github.event_name == 'workflow_run'
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED" ]; then
            echo "main has moved on since this commit was tested; its own run will release it"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # maturin reads the Rust core's metadata with cargo, for the sdist too.
      - name: Set up Rust
        if: steps.current.outputs.stale != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        if: steps.current.outputs.stale != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Work out what to release
        id: plan
        if: steps.current.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .kodex/scripts/plan_release.sh

      # The wheels are built for each platform by the wheels job, from the pushed tag.
      - name: Build the sdist
        if: steps.plan.outputs.released == 'true'
        run: uv build --sdist

      # Outside dist/, which holds only what PyPI takes.
      - name: Write the SBOM
        if: steps.plan.outputs.released == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          uv export --preview-features sbom-export --format cyclonedx1.5 --no-dev --all-extras \
            -o "$RUNNER_TEMP/assets/konstruct-${TAG#v}.cdx.json" > /dev/null

      - name: Attest the build provenance
        id: attest
        if: steps.plan.outputs.released == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            ${{ runner.temp }}/assets/*.cdx.json

      # The Sigstore bundle as a release asset too, for verifiers that take a bundle file.
      - name: Add the provenance to the release assets
        if: steps.plan.outputs.released == 'true'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: jq -c . "$BUNDLE" > "$RUNNER_TEMP/assets/konstruct-${TAG#v}.intoto.jsonl"

      # Tags are pushed only once the build has succeeded; only tags are pushed, never main.
      - name: Tag and publish the release
        if: steps.plan.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            git tag "$TAG"
          fi
          git push origin "refs/tags/${TAG}"
          gh release create "$TAG" dist/* "$RUNNER_TEMP"/assets/* \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" \
              --verify-tag \
              --latest
          # GitHub Action users pin the major version (`uses: kodexlabsio/konstruct@v0`): move it.
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/${major}"

      - name: Upload the sdist
        if: steps.plan.outputs.released == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheel (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # One platform failing does not cancel the others, so a rerun builds only what failed.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: '2_28' }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, manylinux: '2_28' }
          - { os: ubuntu-latest, target: powerpc64le-unknown-linux-gnu, manylinux: '2_28' }
          - { os: ubuntu-latest, target: s390x-unknown-linux-gnu, manylinux: '2_28' }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu, manylinux: '2_31' }
          - { os: ubuntu-latest, target: loongarch64-unknown-linux-gnu, manylinux: '2_36' }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        # The s390x cross compiler targets z900 by default, which lacks instructions the parser's
        # stack-growing crate (psm) assembles; z13 is what the s390x wheel requires anyway.
        env:
          CFLAGS_s390x_unknown_linux_gnu: -march=z13
        with:
          command: build
          args: --release --locked --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  attach:
    name: Attach the wheels
    needs: [release, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the wheels to the GitHub release
      id-token: write # sign the wheels' build provenance with the workflow's identity
      attestations: write # record the provenance with GitHub's artifact attestations
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Attest the wheels' build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl

      - name: Attach them to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          jq -c . "$BUNDLE" > "$RUNNER_TEMP/konstruct-${TAG#v}-wheels.intoto.jsonl"
          gh release upload "$TAG" dist/*.whl "$RUNNER_TEMP/konstruct-${TAG#v}-wheels.intoto.jsonl" \
              --clobber --repo "$REPOSITORY"

  publish:
    name: Publish to PyPI
    needs: [release, attach]
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing: PyPI exchanges the OIDC token for an upload token
    steps:
      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist

      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
