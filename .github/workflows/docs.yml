name: Docs

# Builds the Sphinx documentation on every pull request and push, failing on any warning (a
# broken link, a missing page, an API change the reference no longer matches), the viewer for
# the jaffle_shop example with the same code, as the live demo at /demo/, and the paper, whose
# numbers paper/generate.py measures from the same commit. Pull requests get the paper as an
# artifact. On pushes to main the site job joins the documentation and, when its job succeeded,
# the paper at /paper/konstruct.pdf, and publishes them to GitHub Pages at
# https://kodexlabsio.github.io/konstruct/. A failed paper job stays red but does not hold back
# the documentation, which is then published without the paper.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    name: Build the paper
    # The runner image fixes the TeX Live release that apt installs.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installing Konstruct compiles its Rust core, with this toolchain rather than the runner's.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-science lmodern

      - name: Measure the numbers the paper quotes
        env:
          UV_FROZEN: '1'
        run: uv run python paper/generate.py

      - name: Check the paper against the code
        env:
          UV_FROZEN: '1'
          KONSTRUCT_REQUIRE_PAPER_NUMBERS: '1'
        run: uv run pytest tests/test_paper.py -q

      - name: Build the PDF
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error konstruct.tex

      - name: Upload the paper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: konstruct-paper
          path: |
            paper/konstruct.pdf
            paper/generated/
          if-no-files-found: error

  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installing Konstruct compiles its Rust core, with this toolchain rather than the runner's.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build
        run: uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Build the example warehouse and dbt project
        run: uv run python .kodex/scripts/prepare_example.py

      - name: Build the demo viewer from the jaffle_shop example
        run: |
          uv run konstruct build examples/jaffle_shop
          uv run konstruct verify -C examples/jaffle_shop
          mkdir -p docs/_build/html/demo
          cp examples/jaffle_shop/konstruct-out/graph.html docs/_build/html/demo/index.html

      - name: Upload the documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: konstruct-docs
          path: docs/_build/html
          if-no-files-found: error

  site:
    name: Assemble the site
    needs: [build, paper]
    # The paper is added only when its own job succeeded; the documentation is published either way.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: konstruct-docs
          path: site

      - name: Download the paper
        if: needs.paper.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: konstruct-paper
          path: paper-build

      - name: Add the paper to the site
        if: needs.paper.result == 'success'
        run: |
          mkdir -p site/paper
          cp paper-build/konstruct.pdf site/paper/konstruct.pdf

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: ${{ !cancelled() && needs.site.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy the site
      id-token: write # GitHub Pages verifies the deployment with the workflow's OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
