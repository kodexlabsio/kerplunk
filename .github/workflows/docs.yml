name: Docs

# Builds the Sphinx documentation on every pull request and push, failing on any warning (a
# broken link, a missing page, an API change the reference no longer matches), and the viewer for
# the jaffle_shop example with the same code, as the live demo at /demo/. Pushes to main publish
# both to GitHub Pages at https://kodexlabsio.github.io/konstruct/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build
        run: uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Build the example warehouse and dbt project
        run: uv run python .kodex/scripts/prepare_example.py

      - name: Build the demo viewer from the jaffle_shop example
        run: |
          uv run konstruct build examples/jaffle_shop
          uv run konstruct verify -C examples/jaffle_shop
          mkdir -p docs/_build/html/demo
          cp examples/jaffle_shop/konstruct-out/graph.html docs/_build/html/demo/index.html

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy the site
      id-token: write # GitHub Pages verifies the deployment with the workflow's OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
