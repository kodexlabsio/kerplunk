        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Compare static parsing with Dagster's asset graph
        run: >-
          uv run --with dagster --with dagster-dbt --with dagster-duckdb
          python -m pytest tests/test_dagster.py -m dagster_parity

