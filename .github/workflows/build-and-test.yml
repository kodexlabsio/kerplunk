name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

# No job writes to the repository: each reads the code, and uploads artifacts with the runner's
# own token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  UV_FROZEN: '1'

# Installing Konstruct compiles its Rust core (Cargo.toml and src/) with maturin, the build
# backend, so every job that installs it sets up the stable toolchain first; the rust job also
# checks the crate on the oldest Rust it supports.

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check --output-format=github

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      # GitHub's "Cite this repository" reads CITATION.cff; tests/test_docs.py keeps it in step with
      # pyproject.toml.
      - name: CITATION.cff against the CFF schema
        run: uvx cffconvert@2.0.0 --validate -i CITATION.cff

  rust:
    name: Rust core (format, lint and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked

      # rust-version in Cargo.toml, which installing from source needs at least. The other
      # architectures are checked in the jobs below, which have their cross compilers: the Python
      # parser's stack growth assembles a few lines for its target with a C compiler.
      - name: Check the oldest supported Rust
        run: |
          rustup toolchain install 1.95 --profile minimal
          cargo +1.95 check --locked --all-targets --all-features

      # The assembly takes 64-bit pointers, so a 32-bit ABI on a supported architecture is
      # refused at compile time rather than built.
      - name: Refuse x32
        run: |
          rustup target add x86_64-unknown-linux-gnux32
          if cargo check --locked --target x86_64-unknown-linux-gnux32 2> x32.log; then exit 1; fi
          grep -q 'with 64-bit pointers' x32.log

  rust-architectures:
    name: Rust core on ${{ matrix.target }} (qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Debian's cross compilers link the tests and qemu-user runs them: each architecture's
    # assembly runs for real, not just assembles. qemu emulates the oldest processor the routines
    # assume (QEMU_CPU), so an instruction from a later generation fails here: ARMv8.0, POWER8,
    # and an s390x with z13's vector facility and nothing newer.
    container:
      image: public.ecr.aws/docker/library/rust:1.97@sha256:b1b3c9c0d921d7fa0a6d1f9ec7e4eab87f8c8ec97644c3d791450f131dec813f
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-unknown-linux-gnu, qemu: aarch64, gnu: aarch64-linux-gnu, debian: arm64, cpu: cortex-a53 }
          - { target: riscv64gc-unknown-linux-gnu, qemu: riscv64, gnu: riscv64-linux-gnu, debian: riscv64, cpu: rv64 }
          - { target: powerpc64le-unknown-linux-gnu, qemu: ppc64le, gnu: powerpc64le-linux-gnu, debian: ppc64el, cpu: power8 }
          - { target: s390x-unknown-linux-gnu, qemu: s390x, gnu: s390x-linux-gnu, debian: s390x, cpu: 'qemu,vx=on' }
          - { target: loongarch64-unknown-linux-gnu, qemu: loongarch64, gnu: loongarch64-linux-gnu, debian: loong64, cpu: la464 }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      QEMU: ${{ matrix.qemu }}
      GNU: ${{ matrix.gnu }}
      QEMU_CPU: ${{ matrix.cpu }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the cross compiler and qemu
        run: |
          apt-get update
          apt-get install -y --no-install-recommends qemu-user "gcc-${GNU}" "libc6-dev-${{ matrix.debian }}-cross"

      # rust-version in Cargo.toml, on every architecture: global_asm! is stable on powerpc64
      # only from 1.95.
      - name: Check the oldest supported Rust
        run: |
          rustup toolchain install 1.95 --profile minimal --target "$TARGET"
          upper=$(echo "$TARGET" | tr 'a-z-' 'A-Z_')
          export "CARGO_TARGET_${upper}_LINKER=${GNU}-gcc"
          cargo +1.95 check --locked --all-targets --all-features --target "$TARGET"

      - name: Test under qemu
        run: |
          rustup target add "$TARGET"
          upper=$(echo "$TARGET" | tr 'a-z-' 'A-Z_')
          export "CARGO_TARGET_${upper}_LINKER=${GNU}-gcc"
          export "CARGO_TARGET_${upper}_RUNNER=qemu-${QEMU} -L /usr/${GNU}"
          cargo test --locked --target "$TARGET"

  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: '2_28', native: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, manylinux: '2_28', native: false }
          - { os: ubuntu-latest, target: powerpc64le-unknown-linux-gnu, manylinux: '2_28', native: false }
          - { os: ubuntu-latest, target: s390x-unknown-linux-gnu, manylinux: '2_28', native: false }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu, manylinux: '2_31', native: false }
          - { os: ubuntu-latest, target: loongarch64-unknown-linux-gnu, manylinux: '2_36', native: false }
          - { os: macos-latest, target: aarch64-apple-darwin, native: true }
          - { os: macos-latest, target: x86_64-apple-darwin, native: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, native: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, native: false }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One abi3 wheel per platform serves every supported Python. Linux wheels are built in a
      # manylinux container (cross-compiling for the other architectures), so they install on any
      # distribution with glibc 2.28 or newer (2.31 for riscv64 and 2.36 for loongarch64).
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        # The s390x cross compiler targets z900 by default, which lacks instructions the parser's
        # stack-growing crate (psm) assembles; z13 is what the s390x wheel requires anyway.
        env:
          CFLAGS_s390x_unknown_linux_gnu: -march=z13
        with:
          command: build
          args: --release --locked --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Set up uv
        if: matrix.native
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install and run the wheel
        if: matrix.native
        shell: bash
        run: |
          uv tool install dist/*.whl
          konstruct --version

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Conventional Commits
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: uv run cz check --rev-range "$RANGE"

      - name: Kodex Labs commit rules
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: uv run python .kodex/scripts/check_commit_message.py --rev-range "$RANGE"

  release-preparation:
    name: Release preparation
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pull request that prepares a release must prepare exactly what main now calls for; one
      # that prepares none passes, and main releases its changes after the merge.
      - name: Check the prepared version and changelog
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: origin/${{ github.base_ref }}
        run: python3 .kodex/scripts/prepare_release.py --check --no-fetch --base "$BASE" --title "$TITLE"

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: konstruct
          POSTGRES_PASSWORD: konstruct
          POSTGRES_DB: konstruct
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U konstruct"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      iceberg:
        image: apache/iceberg-rest-fixture:latest@sha256:db8de90b5b7693d4ac334c336f91d9bbe320d7b19f4f514d26de84cdfbcbfe8d
        ports:
          - 8181:8181
    env:
      KONSTRUCT_TEST_PG_DSN: postgresql://konstruct:konstruct@localhost:5432/konstruct
      KONSTRUCT_TEST_ICEBERG_URI: http://localhost:8181
      KONSTRUCT_REQUIRE_SERVICES: '1'
      HYPOTHESIS_PROFILE: ci
      KONSTRUCT_BROWSER_CHANNEL: chrome
      KONSTRUCT_TEST_BIGQUERY_ENDPOINT: http://localhost:9050
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # tests/test_compat.py checks that every release tag is in the corpus.
          fetch-tags: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync

      # Started by hand because it needs a --project argument, which service containers cannot pass.
      - name: Start the BigQuery emulator
        run: docker run -d -p 9050:9050 ghcr.io/goccy/bigquery-emulator:latest@sha256:f4e428d265a93dc5ce36c294e1c584c7c9b384117d47ab8ddbb63d8d50b7f393 --project=test

      - name: Wait for the Iceberg REST catalog
        run: |
          for _ in $(seq 1 30); do
            curl -fs http://localhost:8181/v1/config >/dev/null && exit 0
            sleep 2
          done
          echo "The Iceberg REST catalog did not start"
          exit 1

      # The browser tests run once, on the Python version the project develops against, in the
      # Google Chrome that GitHub's runners already have (installing Playwright's Chromium and its
      # system libraries takes many minutes on these images).
      - name: Run tests with coverage
        if: matrix.python == '3.12'
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Run tests
        if: matrix.python != '3.12'
        run: uv run pytest -m "not browser"

      - name: Upload the coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  real-world:
    name: Real-world dbt project (dbt-labs/jaffle-shop)
    runs-on: ubuntu-latest
    # Two clones and dbt builds of jaffle-shop: the real-world tests and the answer benchmark's.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Clone, build and analyse the project
        env:
          KONSTRUCT_REALWORLD: '1'
        run: uv run pytest tests/test_realworld.py

      - name: Check the answer benchmark's reference answers on its warehouse
        env:
          KONSTRUCT_REALWORLD: '1'
        run: uv run pytest tests/test_answer_benchmark.py -m realworld

  airflow-parity:
    name: Airflow parser against Apache Airflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Compare static parsing with Airflow's DagBag
        run: >-
          uv run --with "apache-airflow>=3" --with apache-airflow-providers-standard
          --with apache-airflow-providers-common-sql
          python -m pytest tests/test_airflow_parity.py

  end-to-end:
    name: End to end (jaffle_shop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build the example warehouse and dbt project
        run: uv run python .kodex/scripts/prepare_example.py

      - name: Build the graph in under a minute
        run: |
          start=$(date +%s)
          uv run konstruct build examples/jaffle_shop
          elapsed=$(( $(date +%s) - start ))
          echo "konstruct build took ${elapsed}s"
          if [ "$elapsed" -ge 60 ]; then
            echo "ERROR: konstruct build took ${elapsed}s, the limit is 60s"
            exit 1
          fi

      - name: Query the graph
        run: |
          cd examples/jaffle_shop
          uv run konstruct impact stg_payments.amount
          uv run konstruct trace orders.amount
          uv run konstruct query "which models use payments"

      - name: Verify the lineage against the data
        run: uv run konstruct verify -C examples/jaffle_shop --strict

      - name: Upload the graph
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: konstruct-out
          path: examples/jaffle_shop/konstruct-out

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Build the sdist and wheel
        run: uv build

      - name: Install the wheel as a tool
        run: |
          uv tool install dist/*.whl
          konstruct --version
          konstruct --help

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  install-from-github:
    name: Install as the README describes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE: git+https://github.com/${{ github.repository }}@${{ github.sha }}
    steps:
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: uv tool install from GitHub
        run: |
          uv tool install "$SOURCE"
          konstruct --version

      - name: uvx without installing
        run: uvx --from "$SOURCE" konstruct --help

      - name: An extra
        run: uv tool install --force "konstruct[bigquery] @ $SOURCE"

  action:
    name: GitHub Action and its gate on a breaking and a safe change
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `$/` runs the action from this repository at the commit under test, as `kodexlabsio/konstruct@v0`
    # runs it for users, rather than from whatever an earlier step left in the workspace; so the job
    # needs no checkout.
    steps:
      - name: Make a SQL repository with a change to review
        run: |
          mkdir -p "$RUNNER_TEMP/shop/sql" && cd "$RUNNER_TEMP/shop"
          git init -q -b main
          printf '%s\n' "create table main.ltv as select customer_id, sum(amount) as total" \
            "from raw.orders where status <> 'void' group by customer_id" > sql/ltv.sql
          printf '%s\n' "create table main.report as select customer_id, total from main.ltv" > sql/report.sql
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm base
          sed -i 's/as total/as revenue/' sql/ltv.sql
          echo "SHOP=$RUNNER_TEMP/shop" >> "$GITHUB_ENV"

      - name: Review the breaking change
        id: breaking
        uses: $/
        continue-on-error: true
        with:
          working-directory: ${{ env.SHOP }}
          base: HEAD
          comment: "false"
          gate: "true"

      - name: The breaking change fails the check and the gate
        env:
          OUTCOME: ${{ steps.breaking.outcome }}
          BREAKING: ${{ steps.breaking.outputs.breaking }}
          GATE: ${{ steps.breaking.outputs.gate }}
          SUMMARY: ${{ steps.breaking.outputs.summary }}
          REPORT: ${{ steps.breaking.outputs.report }}
        run: |
          test "$OUTCOME" = failure
          test "$BREAKING" = 1
          test "$GATE" = failed
          test "$SUMMARY" = "1 breaking change, 1 column removed, 1 column added."
          grep -q 'ltv.total. is removed but still read by .report' "$REPORT"
          grep -q 'Gate failed: 1 finding' "$REPORT"

      - name: Update the reader in the same change
        run: sed -i 's/total/revenue/g' "$SHOP/sql/report.sql"

      - name: Review the safe change
        id: safe
        uses: $/
        with:
          working-directory: ${{ env.SHOP }}
          base: HEAD
          comment: "false"
          gate: "true"

      - name: The safe change passes
        env:
          BREAKING: ${{ steps.safe.outputs.breaking }}
          GATE: ${{ steps.safe.outputs.gate }}
        run: |
          test "$BREAKING" = 0
          test "$GATE" = passed

  databricks-live:
    name: Databricks connector against a workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs when the workspace secrets are configured; otherwise the job reports that it skipped.
    env:
      KONSTRUCT_TEST_DATABRICKS_HOST: ${{ secrets.KONSTRUCT_TEST_DATABRICKS_HOST }}
      KONSTRUCT_TEST_DATABRICKS_HTTP_PATH: ${{ secrets.KONSTRUCT_TEST_DATABRICKS_HTTP_PATH }}
      KONSTRUCT_TEST_DATABRICKS_TOKEN: ${{ secrets.KONSTRUCT_TEST_DATABRICKS_TOKEN }}
      KONSTRUCT_TEST_DATABRICKS_CATALOG: ${{ vars.KONSTRUCT_TEST_DATABRICKS_CATALOG || 'main' }}
    steps:
      - name: Checkout code
        if: env.KONSTRUCT_TEST_DATABRICKS_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        if: env.KONSTRUCT_TEST_DATABRICKS_TOKEN != ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        if: env.KONSTRUCT_TEST_DATABRICKS_TOKEN != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Integration tests
        if: env.KONSTRUCT_TEST_DATABRICKS_TOKEN != ''
        run: uv run pytest tests/test_databricks_live.py -m databricks -v

      - name: No workspace configured
        if: env.KONSTRUCT_TEST_DATABRICKS_TOKEN == ''
        run: echo "Set the KONSTRUCT_TEST_DATABRICKS_* repository secrets to run these tests."

  trino:
    name: Trino connector against a Trino server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      trino:
        image: trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
        ports:
          - 8080:8080
    env:
      KONSTRUCT_TEST_TRINO_HOST: localhost
      KONSTRUCT_TEST_TRINO_PORT: '8080'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Wait for Trino to start
        run: |
          for _ in $(seq 1 90); do
            if curl -fs http://localhost:8080/v1/info | grep -q '"starting":false'; then exit 0; fi
            sleep 2
          done
          echo "Trino did not start" >&2
          exit 1

      - name: Integration tests
        run: uv run --extra trino pytest tests/test_trino.py -m trino -v

  viewer:
    name: Viewer (Svelte and TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # konstruct ships the built page so installing it needs no Node.js; it must match the source.
      - name: The committed build is up to date
        run: git diff --exit-code -- konstruct/outputs/viewer.html

  dagster-parity:
