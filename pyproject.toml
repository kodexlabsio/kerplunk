[project]
name = "konstruct"
version = "0.13.1"
description = "Turn a data stack (dbt, SQL, Airflow, warehouse and Iceberg metadata) into a queryable graph with column-level lineage for coding agents."
readme = "README.md"
license = "MIT AND Apache-2.0 AND OFL-1.1"
license-files = ["LICENSE", "licenses/*", "konstruct/semantics/ontologies/NOTICE"]
authors = [{ name = "Kodex Labs Ltd." }]
requires-python = ">=3.11"
keywords = ["lineage", "column-level lineage", "dbt", "airflow", "iceberg", "mcp", "claude-code", "data-catalog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "sqlglot>=30.0,<31",
    # The compiled build of sqlglot parses and prints SQL several times faster. The markers match
    # the platforms it ships wheels for; elsewhere the pure-Python build is used. (musl-based Linux
    # matches too and builds it from source, as it already does DuckDB.)
    "sqlglot[c]>=30.0,<31; sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine in 'x86_64 aarch64')",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
    "pyiceberg>=0.9",
    "mcp>=2.0,<3",
    "jinja2>=3.1",
    "lkml>=1.3",
    "orjson>=3.10",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.12"]
bigquery = ["google-cloud-bigquery>=3.25"]
databricks = ["databricks-sql-connector>=3.4"]
trino = ["trino>=0.330"]
rdf = ["rdflib>=7.1"]
all = ["konstruct[snowflake,bigquery,databricks,trino,rdf]"]

[project.urls]
Homepage = "https://github.com/kodexlabsio/konstruct"
Issues = "https://github.com/kodexlabsio/konstruct/issues"

[project.scripts]
konstruct = "konstruct.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "mypy>=2.0",
    "ruff>=0.17",
    "types-PyYAML",
    "pyiceberg[sql-sqlite]>=0.9",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
    "commitizen>=4.19.3",
    "pre-commit>=4.7.0",
    "playwright>=1.64.1",
    "axe-playwright-python>=0.1.8",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.15",
    "dbt-postgres>=1.11.0",
    "google-cloud-bigquery>=3.47.0",
    "databricks-sql-connector>=4.9.0",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
    "rdflib>=7.1",
]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-argparse>=0.6.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-mermaid>=2.1.1",
]

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

# One package of Python and Rust: the crate at the root (Cargo.toml, src/) builds the extension
# module konstruct._core, which the wheel carries beside the Python modules and their data files.
[tool.maturin]
module-name = "konstruct._core"
python-source = "."
python-packages = ["konstruct"]
features = ["python"]
locked = true
# A build reads the ontology packs from their index alone; the YAML they are made from stays in
# the repository and the sdist.
exclude = [
    { path = "konstruct/semantics/ontologies/*.yml", format = "wheel" },
    { path = "konstruct/semantics/ontologies/generated/**/*", format = "wheel" },
]

# uv reinstalls the project when these change, so an editable install rebuilds the extension
# after a change to the Rust sources.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*" },
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["E501", "SIM905"]

# Matches the Prettier settings of the Kodex Labs projects (and viewer/): single quotes, lines of
# 110, four-space indents and trailing commas. Docstrings keep double quotes, as PEP 257 asks.
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
files = ["konstruct", "tests", "paper", "examples/plugin"]
exclude = ["^tests/fixtures/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyiceberg.*", "duckdb.*", "airflow.*", "dagster.*", "dagster_dbt.*", "dagster_duckdb.*", "fakesnow.*", "snowflake.*", "databricks.*", "trino.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: needs a Postgres server (KONSTRUCT_TEST_PG_DSN)",
    "dbt: needs dbt-core and dbt-duckdb installed",
    "iceberg: uses PyIceberg with a local SQL catalog",
    "browser: drives graph.html in Chromium through Playwright",
    "scale: builds a generated project of hundreds of models",
    "realworld: clones and builds a public dbt project (KONSTRUCT_REALWORLD=1)",
    "airflow_parity: compares the static parser with Airflow itself (needs apache-airflow)",
    "dagster_parity: compares the static parser with Dagster itself (needs dagster)",
    "snowflake: runs against fakesnow (needs fakesnow and snowflake-connector-python<5)",
    "bigquery: runs against the BigQuery emulator (KONSTRUCT_TEST_BIGQUERY_ENDPOINT)",
    "iceberg_rest: needs an Iceberg REST catalog (KONSTRUCT_TEST_ICEBERG_URI)",
    "databricks: runs against a real Databricks workspace (KONSTRUCT_TEST_DATABRICKS_*)",
    "trino: runs against a Trino server (KONSTRUCT_TEST_TRINO_HOST)",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
version_scheme = "pep440"
major_version_zero = true
changelog_file = "CHANGELOG.md"
version_files = ["konstruct/__init__.py:__version__"]

[tool.coverage.run]
branch = true
source = ["konstruct"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
