terms:
- name: Stripe account
  kind: entity
  definition: Prices define the unit cost, currency, and (optional) billing cycle for both recurring and one-time
    purchases of products.
  columns:
  - account.id
- name: Stripe activity itemised 2
  kind: entity
  definition: An activity itemised 2 in Stripe, one row per activity itemised 2, keyed on its activity itemised
    2 ID.
  columns:
  - activity_itemized_2.activity_itemized_2_id
- name: Stripe balance change from activity itemised 2
  kind: entity
  definition: A balance change from activity itemised 2 in Stripe, one row per balance change from activity itemised
    2, keyed on its balance change from activity itemised 2 ID.
  columns:
  - balance_change_from_activity_itemized_2.balance_change_from_activity_itemized_2_id
- name: Stripe balance transaction
  kind: entity
  definition: Balance transactions represent funds moving through your Stripe account. They're created for every
    type of transaction that comes into or flows out of your Stripe account balance.
  columns:
  - balance_transaction|balance_transactions.id
- name: Stripe card
  kind: entity
  definition: Details of a credit card that has been saved to the system.
  columns:
  - card.id
- name: Stripe charge
  kind: entity
  definition: To charge a credit or a debit card, you create a Charge object. You can retrieve and refund individual
    charges as well as list all charges. Charges are identified by a unique, random ID.
  columns:
  - charge|charges.id
- name: Stripe checkout session
  kind: entity
  definition: A checkout session in Stripe, one row per checkout session, keyed on its ID.
  columns:
  - checkout_sessions.id
- name: Stripe coupon
  kind: entity
  definition: A coupon represents a discount that can be applied to a subscription or invoice. It contains information
    about the coupon's duration, amount, and applicability.
  columns:
  - coupon|coupons.id
- name: Stripe credit note
  kind: entity
  definition: Credit notes are documents that decrease the amount owed on an invoice. They're the only way to adjust
    the amount of a finalised invoice other than voiding and recreating the invoice.
  columns:
  - credit_note.id
- name: Stripe credit note line item
  kind: entity
  definition: The different items that a credit note contains.
  columns:
  - credit_note_line_item.id
- name: Stripe customer
  kind: entity
  definition: Customer objects allow you to perform recurring charges, and to track multiple charges, that are associated
    with the same customer.
  columns:
  - customer|customers.id
- name: Stripe dispute
  kind: entity
  definition: The details of a dispute related to a charge. A dispute occurs when a customer questions your charge
    with their card issuer. When this happens, you're given the opportunity to respond to the dispute with evidence
    that shows that the charge is legitimate.
  columns:
  - dispute|disputes.id
- name: Stripe event
  kind: entity
  definition: An event in Stripe, one row per event, keyed on its ID.
  columns:
  - events.id
- name: Stripe invoice
  kind: entity
  definition: Invoices are statements of amounts owed by a customer, and are either generated one-off, or generated
    periodically from a subscription.
  columns:
  - invoice|invoices.id
- name: Stripe payment intent
  kind: entity
  definition: A Payment Intent guides you through the process of collecting a payment from your customer.
  columns:
  - payment_intent|payment_intents.id
- name: Stripe payment method
  kind: entity
  definition: PaymentMethod objects represent your customer's payment instruments. They can be used with PaymentIntents
    to collect payments or saved to Customer objects to store instrument details for future payments.
  columns:
  - payment_method.id
- name: Stripe payout
  kind: entity
  definition: A Payout object is created when you receive funds from Stripe, or when you initiate a payout to either
    a bank account or debit card of a connected Stripe account.
  columns:
  - payout|payouts.id
- name: Stripe plan
  kind: entity
  definition: Plans define the base price, currency, and billing cycle for recurring purchases of products.
  columns:
  - plan|plans.id
- name: Stripe price
  kind: entity
  definition: Prices define the unit cost, currency, and (optional) billing cycle for both recurring and one-time
    purchases of products.
  columns:
  - price.id
- name: Stripe product
  kind: entity
  definition: A product object represents an individual product to be sold, with various attributes detailing its
    properties and behaviours.
  columns:
  - product|products.id
- name: Stripe promotion code
  kind: entity
  definition: A promotion code in Stripe, one row per promotion code, keyed on its ID.
  columns:
  - promotion_codes.id
- name: Stripe refund
  kind: entity
  definition: Details of transactions that have been refunded.
  columns:
  - refund|refunds.id
- name: Stripe subscription
  kind: entity
  definition: Subscriptions allow you to charge a customer on a recurring basis. Please note this source table is
    only present in connectors setup **before** February 09, 2022.
  columns:
  - subscription|subscriptions.id
- name: Stripe subscription discount
  kind: entity
  definition: A subscription discount represents the application of a coupon or promotion code specifically applied
    to a subscription. It contains information about when the discount began, when it will end, and what it is applied
    to.
  columns:
  - subscription_discount.id
- name: Stripe subscription item
  kind: entity
  definition: Subscription items allow you to create customer subscriptions with more than one plan, making it easy
    to represent complex billing relationships.
  columns:
  - subscription_item.id
- name: Stripe subscription schedule
  kind: entity
  definition: A subscription schedule in Stripe, one row per subscription schedule, keyed on its ID.
  columns:
  - subscription_schedules.id
- name: Stripe transfer
  kind: entity
  definition: A Transfer object is created when you move funds between Stripe accounts as part of Connect. Before
    April 6, 2017, transfers also represented movement of funds from a Stripe account to a card or bank account.
    That has since been moved to the Payout object. The Payout object represents money moving from a Stripe account
    to an external account (bank or debit card).
  columns:
  - transfer.id
- name: Stripe activity itemised 2 amount
  kind: measure
  definition: Amount, as the `activity_itemized_2` table of Stripe records it.
  columns:
  - activity_itemized_2.amount
- name: Stripe activity itemised 2 customer facing amount
  kind: measure
  definition: Customer facing amount, as the `activity_itemized_2` table of Stripe records it.
  columns:
  - activity_itemized_2.customer_facing_amount
- name: Stripe activity summary 1 count
  kind: measure
  definition: Count, as the `activity_summary_1` table of Stripe records it.
  columns:
  - activity_summary_1.count
- name: Stripe activity summary 1 fee
  kind: measure
  definition: Fee, as the `activity_summary_1` table of Stripe records it.
  columns:
  - activity_summary_1.fee
- name: Stripe balance change from activity itemised 2 fee
  kind: measure
  definition: Fee, as the `balance_change_from_activity_itemized_2` table of Stripe records it.
  columns:
  - balance_change_from_activity_itemized_2.fee
- name: Stripe balance change from activity summary 1 count
  kind: measure
  definition: Count, as the `balance_change_from_activity_summary_1` table of Stripe records it.
  columns:
  - balance_change_from_activity_summary_1.count
- name: Stripe balance change from activity summary 1 fee
  kind: measure
  definition: Fee, as the `balance_change_from_activity_summary_1` table of Stripe records it.
  columns:
  - balance_change_from_activity_summary_1.fee
- name: Stripe balance transaction amount
  kind: measure
  definition: Gross amount of the transaction, in cents.
  columns:
  - balance_transaction|balance_transactions.amount
- name: Stripe balance transaction fee
  kind: measure
  definition: Fees (in cents) paid for this transaction.
  columns:
  - balance_transaction|balance_transactions.fee
- name: Stripe charge amount
  kind: measure
  definition: Amount intended to be collected by this payment. A positive integer representing how much to charge
    in the smallest currency unit (e.g., 100 cents to charge $1.00 or 100 to charge ¥100, a zero-decimal currency).
  columns:
  - charge|charges.amount
- name: Stripe charge application fee amount
  kind: measure
  definition: The amount of the application fee (if any) for the charge.
  columns:
  - charge|charges.application_fee_amount
- name: Stripe credit note amount
  kind: measure
  definition: The integer amount in cents representing the total amount of the credit note, including tax.
  columns:
  - credit_note.amount
- name: Stripe credit note discount amount
  kind: measure
  definition: The integer amount in cents representing the total amount of discount that was credited.
  columns:
  - credit_note.discount_amount
- name: Stripe credit note subtotal
  kind: measure
  definition: The integer amount in cents representing the amount of the credit note, excluding tax and invoice
    level discounts.
  columns:
  - credit_note.subtotal
- name: Stripe credit note total
  kind: measure
  definition: The integer amount in cents representing the total amount of the credit note, including tax and all
    discount.
  columns:
  - credit_note.total
- name: Stripe credit note line item amount
  kind: measure
  definition: The integer amount in cents representing the gross amount being credited for this line item, excluding
    (exclusive) tax and discounts.
  columns:
  - credit_note_line_item.amount
- name: Stripe credit note line item discount amount
  kind: measure
  definition: The integer amount in cents representing the discount being credited for this line item.
  columns:
  - credit_note_line_item.discount_amount
- name: Stripe credit note line item quantity
  kind: measure
  definition: The number of units of product being credited.
  columns:
  - credit_note_line_item.quantity
- name: Stripe credit note line item unit amount
  kind: measure
  definition: The cost of each unit of product being credited.
  columns:
  - credit_note_line_item.unit_amount
- name: Stripe customer account balance
  kind: measure
  definition: Current balance, if any, being stored on the customer. If negative, the customer has credit to apply
    to their next invoice. If positive, the customer has an amount owed that will be added to their next invoice.
  columns:
  - customer.account_balance
- name: Stripe customer balance
  kind: measure
  definition: Current balance, if any, being stored on the customer. If negative, the customer has credit to apply
    to their next invoice. If positive, the customer has an amount owed that will be added to their next invoice.
    The balance does not refer to any unpaid invoices; it solely takes into account amounts that have yet to be
    successfully applied to any invoice.
  columns:
  - customer|customers.balance
- name: Stripe discount amount
  kind: measure
  definition: The amount of discount applied.
  columns:
  - discount.amount
- name: Stripe dispute amount
  kind: measure
  definition: Disputed amount. Usually the amount of the charge, but can differ (usually because of currency fluctuation
    or because only part of the order is disputed).
  columns:
  - dispute|disputes.amount
- name: Stripe dispute evidence details submission count
  kind: measure
  definition: The number of times evidence has been submitted. Typically, you may only submit evidence once.
  columns:
  - dispute.evidence_details_submission_count
- name: Stripe fee amount
  kind: measure
  definition: Amount of the fee, in cents.
  columns:
  - fee.amount
- name: Stripe invoice application fee amount
  kind: measure
  definition: Application fee amount, as the `invoices` table of Stripe records it.
  columns:
  - invoices.application_fee_amount
- name: Stripe invoice attempt count
  kind: measure
  definition: Number of payment attempts made for this invoice, from the perspective of the payment retry schedule.
  columns:
  - invoice|invoices.attempt_count
- name: Stripe invoice ending balance
  kind: measure
  definition: Ending balance, as the `invoices` table of Stripe records it.
  columns:
  - invoices.ending_balance
- name: Stripe invoice post payment credit notes amount
  kind: measure
  definition: Total amount of all post-payment credit notes issued for this invoice.
  columns:
  - invoice.post_payment_credit_notes_amount
- name: Stripe invoice pre payment credit notes amount
  kind: measure
  definition: Total amount of all pre-payment credit notes issued for this invoice.
  columns:
  - invoice.pre_payment_credit_notes_amount
- name: Stripe invoice subtotal
  kind: measure
  definition: Total of all subscriptions, invoice items, and prorations on the invoice before any discount or tax
    is applied.
  columns:
  - invoice|invoices.subtotal
- name: Stripe invoice subtotal excluding tax
  kind: measure
  definition: Subtotal excluding tax, as the `invoices` table of Stripe records it.
  columns:
  - invoices.subtotal_excluding_tax
- name: Stripe invoice tax
  kind: measure
  definition: The amount of tax on this invoice. This is the sum of all the tax amounts on this invoice.
  columns:
  - invoice|invoices.tax
- name: Stripe invoice total
  kind: measure
  definition: Total after discounts and taxes.
  columns:
  - invoice|invoices.total
- name: Stripe invoice total excluding tax
  kind: measure
  definition: Total excluding tax, as the `invoices` table of Stripe records it.
  columns:
  - invoices.total_excluding_tax
- name: Stripe invoice line item amount
  kind: measure
  definition: The amount, in cents.
  columns:
  - invoice_line_item.amount
- name: Stripe invoice line item quantity
  kind: measure
  definition: The quantity of the subscription, if the line item is a subscription or a proration.
  columns:
  - invoice_line_item.quantity
- name: Stripe invoice line item unit amount excluding tax
  kind: measure
  definition: The amount in cents representing the unit amount for this line item, excluding all tax and discounts.
    Stripe sends this as a decimal string.
  columns:
  - invoice_line_item.unit_amount_excluding_tax
- name: Stripe payment intent amount
  kind: measure
  definition: Amount intended to be collected by this PaymentIntent. A positive integer representing how much to
    charge in the smallest currency unit (e.g., 100 cents to charge $1.00 or 100 to charge ¥100, a zero-decimal
    currency).
  columns:
  - payment_intent|payment_intents.amount
- name: Stripe payment intent application fee amount
  kind: measure
  definition: The amount of the application fee (if any) for the resulting payment.
  columns:
  - payment_intent|payment_intents.application_fee_amount
- name: Stripe payout amount
  kind: measure
  definition: Amount (in cents) to be transferred to your bank account or debit card.
  columns:
  - payout|payouts.amount
- name: Stripe plan amount
  kind: measure
  definition: The unit amount in cents to be charged, represented as a whole integer if possible.
  columns:
  - plan.amount
- name: Stripe price unit amount
  kind: measure
  definition: The unit amount in cents to be charged, represented as a whole integer if possible. Only set if billing_scheme=per_unit.
  columns:
  - price.unit_amount
- name: Stripe refund amount
  kind: measure
  definition: Amount, in cents.
  columns:
  - refund|refunds.amount
- name: Stripe subscription item quantity
  kind: measure
  definition: The quantity of the plan to which the customer is subscribed.
  columns:
  - subscription_item.quantity
- name: Stripe transfer amount
  kind: measure
  definition: Amount in cents to be transferred.
  columns:
  - transfer.amount
