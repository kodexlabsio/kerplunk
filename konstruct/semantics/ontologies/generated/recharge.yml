- name: Recharge charge
  kind: entity
  definition: Table of all charges (financial transactions) linked to the purchase of an item. A charge is linked
    to a corresponding order, an order is created once the corresponding charge is successful.
  columns:
  - charge.id
- name: Recharge customer
  kind: entity
  definition: Table of all customer details holding account and billing information. Email is unique on the customer,
    no two customers for a store can have the same email.
  columns:
