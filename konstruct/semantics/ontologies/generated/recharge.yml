- name: Recharge one time product
  kind: entity
  definition: Table of all one-times which represent non-recurring line items on a queued charges.
  columns:
  - one_time_product.id
- name: Recharge order
  kind: entity
  definition: Table of all orders after a charge is successfully processed.
  columns:
  - order.id
- name: Recharge plan
  kind: entity
  definition: A plan in Recharge, one row per plan, keyed on its ID.
