terms:
- name: Salesforce account
  kind: entity
  definition: Represents an individual account, which is an organization or person involved with your business (such
    as customers, competitors, and partners).
  columns:
  - account.id
- name: Salesforce campaign
  kind: entity
  definition: Represents a marketing campaign, such as a direct mail promotion, webinar, or trade show.
  columns:
  - campaign.id
- name: Salesforce campaign member
  kind: entity
  definition: Represents the relationship between a campaign and either a lead or a contact.
  columns:
  - campaign_member.id
- name: Salesforce contact
  kind: entity
  definition: Represents a contact, which is a person associated with an account.
  columns:
  - contact.id
- name: Salesforce content note
  kind: entity
  definition: A content note in Salesforce, one row per content note, keyed on its ID.
  columns:
  - content_notes.id
- name: Salesforce event
  kind: entity
  definition: Represents an event in the calendar. In the user interface, event and task records are collectively
    referred to as activities.
  columns:
  - event.id
- name: Salesforce lead
  kind: entity
  definition: Represents a prospect or lead.
  columns:
  - lead.id
- name: Salesforce opportunity
  kind: entity
  definition: Represents an opportunity, which is a sale or pending deal.
  columns:
  - opportunity.id
- name: Salesforce opportunity line item
  kind: entity
  definition: Represents an opportunity line item, which is a member of the list of Product2 products associated
    with an Opportunity.
  columns:
  - opportunity_line_item.id
- name: Salesforce order
  kind: entity
  definition: Represents an order associated with a contract or an account.
  columns:
  - order.id
- name: Salesforce product 2
  kind: entity
  definition: Represents a product that your company sells.
  columns:
  - product_2.id
- name: Salesforce record type
  kind: entity
  definition: Represents a record type, which allows you to offer different business processes, picklist values,
    and page layouts to different users.
  columns:
  - record_type.id
- name: Salesforce task
  kind: entity
  definition: Represents a business activity such as making a phone call or other to-do items. In the user interface,
    Task and Event records are collectively referred to as activities.
  columns:
  - task.id
- name: Salesforce user
  kind: entity
  definition: Represents a user in your organisation.
  columns:
  - user.id
- name: Salesforce user role
  kind: entity
  definition: Represents a user role in your organisation.
  columns:
  - user_role.id
- name: Salesforce account annual revenue
  kind: measure
  definition: Estimated annual revenue of the account.
  columns:
  - account.annual_revenue
- name: Salesforce campaign actual cost
  kind: measure
  definition: Amount of money spent to run the campaign.
  columns:
  - campaign.actual_cost
- name: Salesforce campaign budgeted cost
  kind: measure
  definition: Amount of money budgeted for the campaign.
  columns:
  - campaign.budgeted_cost
- name: Salesforce event duration in minutes
  kind: measure
  definition: Contains the event length, in minutes.
  columns:
  - event.duration_in_minutes
- name: Salesforce event what count
  kind: measure
  definition: Available if your organisation has enabled Shared Activities. Represents the count of related EventRelations
    pertaining to the WhatId. The count of the WhatId must be 1 or less.
  columns:
  - event.what_count
- name: Salesforce event who count
  kind: measure
  definition: Available to organisations that have Shared Activities enabled. Represents the count of related EventRelations
    pertaining to the WhoId.
  columns:
  - event.who_count
- name: Salesforce lead annual revenue
  kind: measure
  definition: Annual revenue for the lead's company.
  columns:
  - lead.annual_revenue
- name: Salesforce opportunity amount
  kind: measure
  definition: Estimated total sale amount. For opportunities with products, the amount is the sum of the related
    products.
  columns:
  - opportunity.amount
- name: Salesforce opportunity expected revenue
  kind: measure
  definition: Read-only field that is equal to the product of the opportunity Amount field and the Probability.
  columns:
  - opportunity.expected_revenue
- name: Salesforce opportunity line item discount
  kind: measure
  definition: 'Discount for the product as a percentage. When updating these records: If you specify Discount without
    specifying TotalPrice, the TotalPrice is adjusted to accommodate the new Discount value, and the UnitPrice is
    held constant. If you specify both Discount and Quantity, you must also specify either TotalPrice or UnitPrice
    so the system knows which one to automatically adjust.'
  columns:
  - opportunity_line_item.discount
- name: Salesforce opportunity line item quantity
  kind: measure
  definition: 'Read-only if this record has a quantity schedule, a revenue schedule, or both a quantity and a revenue
    schedule. When updating these records: If you specify Quantity without specifying the UnitPrice, the UnitPrice
    value will be adjusted to accommodate the new Quantity value, and the TotalPrice will be held constant.'
  columns:
  - opportunity_line_item.quantity
- name: Salesforce opportunity line item total price
  kind: measure
  definition: This field is available only for backward compatibility. It represents the total price of the OpportunityLineItem.
    If you do not specify UnitPrice, this field is required. If you specify Discount and Quantity, this field or
    UnitPrice is required. When updating these records, you can change either this value or the UnitPrice, but not
    both at the same time.
  columns:
  - opportunity_line_item.total_price
- name: Salesforce opportunity line item unit price
  kind: measure
  definition: The unit price for the opportunity line item. In the Salesforce user interface, this field's value
    is calculated by dividing the total price of the opportunity line item by the quantity listed for that line
    item. Label is Sales Price. This field or TotalPrice is required. You can't specify both. If you specify Discount
    and Quantity, this field or TotalPrice is required.
  columns:
  - opportunity_line_item.unit_price
- name: Salesforce order total amount
  kind: measure
  definition: The total amount for the order products associated with this order. This field is available in API
    v48.0 and later.
  columns:
  - order.total_amount
- name: Salesforce task call duration in seconds
  kind: measure
  definition: Duration of the call in seconds. Not subject to field-level security, available for any user in an
    organisation with Salesforce CRM Call Center.
  columns:
  - task.call_duration_in_seconds
- name: Salesforce task what count
  kind: measure
  definition: Available to organisations that have Shared Activities enabled. Count of related TaskRelations pertaining
    to WhatId. Count of the WhatId must be 1 or less.
  columns:
  - task.what_count
- name: Salesforce task who count
  kind: measure
  definition: Available to organisations that have Shared Activities enabled. Count of related TaskRelations pertaining
    to WhoId.
  columns:
  - task.who_count
