name: aws_cloud_cost
title: AWS Cloud Cost
description: The AWS Cloud Cost tables that Fivetran lands, with 10 measures.
schemas:
- '*aws_cloud_cost*'
origins:
- fivetran
match:
- aws_cost_report:
  - bill_bill_type
  - bill_billing_entity
  - bill_billing_period_end_date
terms:
- name: AWS Cloud Cost AWS cost report line item blended cost
  kind: measure
  definition: The `blended_rate` multiplied by the `usage_amount`. `blended_cost` is blank for line items that have
    a `line_item_type` of `Discount`. Discounts are calculated using only the unblended cost of a member account,
    aggregated by member account and SKU. As a result, `blended_cost` is not available for discounts. Aliased from
    `line_item_blended_cost` to `blended_cost` in the staging layer.
  columns:
  - aws_cost_report.line_item_blended_cost
- name: AWS Cloud Cost AWS cost report line item normalised usage amount
  kind: measure
  definition: The amount of usage that you incurred, in normalised units, for size-flexible RIs. This is equal to
    `line_item_usage_amount` multiplied by `line_item_normalization_factor`. Aliased from `line_item_normalized_usage_amount`
    to `normalized_usage_amount` in the staging layer.
  columns:
  - aws_cost_report.line_item_normalized_usage_amount
- name: AWS Cloud Cost AWS cost report line item unblended cost
  kind: measure
  definition: The `unblended_Cost` is the `unblended_rate` multiplied by the `usageAmount`. Aliased from `line_item_tax_type`
    to `tax_type` in the staging layer.
  columns:
  - aws_cost_report.line_item_unblended_cost
- name: AWS Cloud Cost AWS cost report line item usage amount
  kind: measure
  definition: The amount of usage that you incurred during the specified time period. For size-flexible Reserved
    Instances, use the `reservation_total_reserved_units` column instead. Certain subscription charges will have
    a Usage Amount of 0. Aliased from `line_item_usage_amount` to `usage_amount` in the staging layer.
  columns:
  - aws_cost_report.line_item_usage_amount
- name: AWS Cloud Cost AWS cost report pricing public on demand cost
  kind: measure
  definition: The total cost for the line item based on public On-Demand Instance rates. If you have SKUs with multiple
    On-Demand public costs, the equivalent cost for the highest tier is displayed. For example, services offering
    free-tiers or tiered pricing. Aliased from `pricing_public_on_demand_cost` to `public_on_demand_cost` in the
    staging layer.
  columns:
  - aws_cost_report.pricing_public_on_demand_cost
- name: AWS Cloud Cost AWS cost report reservation effective cost
  kind: measure
  definition: The sum of both the upfront and hourly rate of your RI, averaged into an effective hourly rate. `reservation_effective_cost`
    is calculated by taking the `reservation_amortized_upfront_cost_for_usage` and adding it to the `reservation_recurring_fee_for_usage`.
  columns:
  - aws_cost_report.reservation_effective_cost
- name: AWS Cloud Cost AWS cost report reservation unused normalised unit quantity
  kind: measure
  definition: The number of unused normalised units for a size-flexible Regional RI that you didn't use during this
    billing period.
  columns:
  - aws_cost_report.reservation_unused_normalized_unit_quantity
- name: AWS Cloud Cost AWS cost report reservation unused quantity
  kind: measure
  definition: The number of RI hours that you didn't use during this billing period.
  columns:
  - aws_cost_report.reservation_unused_quantity
- name: AWS Cloud Cost AWS cost report reservation unused recurring fee
  kind: measure
  definition: The recurring fees associated with your unused reservation hours for partial upfront and no upfront
    RIs. Because all upfront RIs don't have recurring fees greater than 0, the value for All Upfront RIs is 0.
  columns:
  - aws_cost_report.reservation_unused_recurring_fee
- name: AWS Cloud Cost AWS cost report savings plan savings plan effective cost
  kind: measure
  definition: The proportion of the Savings Plan monthly commitment amount (upfront and recurring) that is allocated
    to each usage line. Aliased from `savings_plan_savings_plan_effective_cost` to `savings_plan_effective_cost`
    in the staging layer.
  columns:
  - aws_cost_report.savings_plan_savings_plan_effective_cost
relationships: []
