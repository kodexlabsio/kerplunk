terms:
- name: Zuora account
  kind: entity
  definition: An account is a customer account that collects all of the critical information about the customer,
    such as contact information, payment terms, and payment methods.
  columns:
  - account.id
- name: Zuora amendment
  kind: entity
  definition: When a customer needs to make a change to a subscription, you make that change through an amendment.
    Common subscription changes include 'Changing the terms and conditions of a contract; add a product or update
    an existing product to a subscription; renew, cancel, suspend or resume a subscription.'.
  columns:
  - amendment.id
- name: Zuora contact
  kind: entity
  definition: Customer who holds an account or who is otherwise a person to contact about an account.
  columns:
  - contact.id
- name: Zuora credit balance adjustment
  kind: entity
  definition: An adjustment to change a customer's credit balance. Applies adjustments to credit balances on billing
    accounts. This includes applying credit balance to invoices and transferring an invoice to a credit balance.
  columns:
  - credit_balance_adjustment.id
- name: Zuora invoice
  kind: entity
  definition: An invoice represents a bill to a customer, providing information about customers' accounts for invoices,
    including dates, status, and amounts. It is created at the account level, and can include all of the charges
    for multiple subscriptions for an account.
  columns:
  - invoice.id
- name: Zuora order
  kind: entity
  definition: Orders are contractual agreements between merchants and customers. You can create multiple subscriptions
    and subscription amendments at once in a single order. All the operations on subscriptions in orders are done
    by order actions.
  columns:
  - order.id
- name: Zuora payment
  kind: entity
  definition: A payment is the money that customers send to pay for invoices related to their subscriptions.
  columns:
  - payment.id
- name: Zuora payment method
  kind: entity
  definition: Payment methods are the ways in which customers pay for their subscriptions. Your customers can choose
    a payment method from your company's list of preferred payment methods.
  columns:
  - payment_method.id
- name: Zuora product
  kind: entity
  definition: A product is an item or service that your company sells. In the subscription economy, a product is
    generally a service that your customers subscribe to rather than a physical item that they purchase one time.
  columns:
  - product.id
- name: Zuora product rate plan
  kind: entity
  definition: A product rate plan is the part of a product that your customers subscribe to. Each product can have
    multiple product rate plans, and each product rate plan can have multiple product rate plan charges, which are
    fees for products and their product rate plans.
  columns:
  - product_rate_plan.id
- name: Zuora product rate plan charge
  kind: entity
  definition: A product rate plan charge represents a charge model or a set of fees associated with a product rate
    plan, which is the part of a product that your customers subscribe to. Each product rate plan can have multiple
    product rate plan charges.
  columns:
  - product_rate_plan_charge.id
- name: Zuora rate plan
  kind: entity
  definition: A rate plan is part of a subscription or an amendment to a subscription, and it comes from a product
    rate plan. Rate plans represent a price or a collection of prices for a service you sell. An individual rate
    plan contains all charges specific to a particular subscription.
  columns:
  - rate_plan.id
- name: Zuora rate plan charge
  kind: entity
  definition: A rate plan charge is part of a subscription or an amendment to a subscription, and it comes from
    a product rate plan charge. Rate plan charges represent the actual charges for the rate plans or services that
    you sell.
  columns:
  - rate_plan_charge.id
- name: Zuora refund
  kind: entity
  definition: A refund returns money to a customer - as opposed to a credit, which creates a customer credit balance
    that may be applied to reduce the amount owed to you. Electronic refunds are processed by Zuora via a payment
    gateway. External refunds indicate that the refund was processed outside of Zuora, say by a check, and the transaction
    must be recorded.
  columns:
  - refund.id
- name: Zuora refund invoice payment
  kind: entity
  definition: Refund invoice payment details.
  columns:
  - refund_invoice_payment.id
- name: Zuora taxation item
  kind: entity
  definition: Used to add a tax amount to an invoice item. Changes that you make with this object affect the product
    charges in your product catalogue, but not the charges in existing subscriptions. To change taxes in existing
    subscriptions, you need to amend the subscription - remove the existing charge and replace it with the modified
    charge.
  columns:
  - taxation_item.id
