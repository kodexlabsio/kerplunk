terms:
- name: Workday Financial Management company
  kind: entity
  definition: The legal entities that journal entries post to. Workday models companies as organisations, so identifying
    fields carry an organisation prefix. This table also holds the accounting sign-convention settings that govern
    how debits and credits are stored.
  columns:
  - company.id
- name: Workday Financial Management currency
  kind: entity
  definition: Currencies referenced by journal entries and their lines. Workday records journal amounts in both
    a transaction currency and the ledger's functional currency.
  columns:
  - currency.id
- name: Workday Financial Management fiscal year
  kind: entity
  definition: The fiscal years of a fiscal schedule, with their start and end dates. Resolves the company's fiscal_schedule_code
    to a schedule, and gives year-to-date figures a boundary to reset on.
  columns:
  - fiscal_year.fiscal_year_id
- name: Workday Financial Management journal entry
  kind: entity
  definition: The header of an accounting journal entry. One row per journal entry, carrying the accounting date,
    status, source system, ledger, and company that the entry posts to. Individual debit and credit amounts live
    on journal_entry_line.
  columns:
  - journal_entry.id
- name: Workday Financial Management journal source
  kind: entity
  definition: The originating system or business process that produced a journal entry, for example Manual Journal,
    Supplier Invoice, or Payroll. Used to attribute general ledger activity back to the process that created it.
  columns:
  - journal_source.id
- name: Workday Financial Management ledger
  kind: entity
  definition: The set of books a journal entry posts to. A company may maintain several ledgers, for example an
    actuals ledger alongside separate budget or statistical ledgers.
  columns:
  - ledger.id
- name: Workday Financial Management ledger account
  kind: entity
  definition: The chart of accounts. One row per ledger account. The id is the account code, which can repeat across
    account sets. Journal entry lines reference it through ledger_account_code, not ledger_account_id.
  columns:
  - ledger_account.id
- name: Workday Financial Management business plan entry line credit amount
  kind: measure
  definition: Budgeted credit amount on the line, in the plan's currency.
  columns:
  - business_plan_entry_line.credit_amount
- name: Workday Financial Management business plan entry line debit amount
  kind: measure
  definition: Budgeted debit amount on the line, in the plan's currency.
  columns:
  - business_plan_entry_line.debit_amount
- name: Workday Financial Management journal entry line credit amount
  kind: measure
  definition: Credit amount on the line, in the transaction currency.
  columns:
  - journal_entry_line.credit_amount
- name: Workday Financial Management journal entry line debit amount
  kind: measure
  definition: Debit amount on the line, in the transaction currency.
  columns:
  - journal_entry_line.debit_amount
- name: Workday Financial Management journal entry line ledger credit amount
  kind: measure
  definition: Credit amount on the line, converted to the ledger's functional currency.
  columns:
  - journal_entry_line.ledger_credit_amount
- name: Workday Financial Management journal entry line ledger debit amount
  kind: measure
  definition: Debit amount on the line, converted to the ledger's functional currency.
  columns:
  - journal_entry_line.ledger_debit_amount
- name: Workday Financial Management journal entry line quantity
  kind: measure
  definition: Statistical or unit quantity recorded on the line.
  columns:
  - journal_entry_line.quantity
