name: Konstruct lineage review
description: Review dbt, SQL and DAG changes on pull requests column by column, and fail those that remove a column still read downstream.
author: Kodex Labs
branding:
  icon: share-2
  color: blue

inputs:
  base:
    description: >-
      Commit to compare with. Defaults to the pull request's base branch, or the merge base with
      main outside a pull request.
    required: false
    default: ""
  working-directory:
    description: The directory holding the dbt project, SQL or DAGs (the repository root by default).
    required: false
    default: "."
  comment:
    description: Post the review as a pull request comment, updated in place on each push.
    required: false
    default: "true"
  fail-on-breaking:
    description: Fail the check when the change removes a column that something downstream still reads.
    required: false
    default: "true"
  gate:
    description: >-
      Run `konstruct gate` and fail the check when it fails: a removed column something still reads
      (whatever `fail-on-breaking` says), an approved term whose meaning changes, or a changed
      column that computes a business idea differently from an existing one. Its findings are added
      to the review.
    required: false
    default: "false"
  build-args:
    description: >-
      Arguments for `konstruct build`. The default reads no warehouse and never runs dbt, so no
      credentials are needed and a pull request's own macros never run; lineage then comes from
      committed dbt artefacts, Konstruct's own sandboxed rendering of dbt models, and the SQL.
    required: false
    default: "--no-warehouse --no-dbt"
  extras:
    description: Konstruct extras to install, for example `snowflake` or `bigquery,databricks`.
    required: false
    default: ""
  python-version:
    description: Python version to run Konstruct with.
    required: false
    default: "3.12"
  token:
    description: Token used to post the comment.
    required: false
    default: ${{ github.token }}

outputs:
  breaking:
    description: Number of breaking changes.
    value: ${{ steps.diff.outputs.breaking }}
  gate:
    description: "`passed` or `failed` when the gate runs, empty otherwise."
    value: ${{ steps.gate.outputs.gate }}
  summary:
    description: One-line summary of the change.
    value: ${{ steps.diff.outputs.summary }}
  report:
    description: Path to the markdown review.
    value: ${{ steps.diff.outputs.report }}
  json:
    description: Path to the review as JSON.
    value: ${{ steps.diff.outputs.json }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}

    # Installing Konstruct compiles its Rust core, with this toolchain rather than the runner's.
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable

    - name: Install Konstruct
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
      run: |
        # The action's own checkout is the Konstruct version to run, so a pinned `@v0.7.0` runs 0.7.0.
        if [ -n "$EXTRAS" ]; then
          uv tool install --quiet "konstruct[${EXTRAS}] @ file://${GITHUB_ACTION_PATH}"
        else
          uv tool install --quiet "konstruct @ file://${GITHUB_ACTION_PATH}"
        fi
        konstruct --version

    - name: Fetch the base branch
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --quiet --no-tags --unshallow origin || true
        fi
        # A working directory need not be a clone: with no `origin` remote there is no base branch
        # to fetch, and an explicit `base` input names the commit to compare with.
        if [ -n "$BASE_REF" ] && git remote get-url origin > /dev/null 2>&1; then
          git fetch --quiet --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        fi

    - name: Build the graph
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
      run: |
        # shellcheck disable=SC2086
        konstruct build $BUILD_ARGS

    - name: Compare with the base
      id: diff
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BASE: ${{ inputs.base }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        base="$INPUT_BASE"
        if [ -z "$base" ] && [ -n "$BASE_REF" ]; then
          base="origin/${BASE_REF}"
        fi
        report="${RUNNER_TEMP}/konstruct-diff.md"
        json="${RUNNER_TEMP}/konstruct-diff.json"
        rm -f "$json"
        set +e
        konstruct diff ${base:+--base "$base"} --format markdown --json-file "$json" -q > "$report"
        status=$?
        set -e
        if [ ! -f "$json" ]; then
          echo "::error::konstruct diff failed (exit status ${status})"
          cat "$report"
          exit 1
        fi
        breaking=$(jq '.breaking | length' "$json")
        summary=$(jq -r '.summary' "$json")
        {
          echo "breaking=${breaking}"
          echo "summary=${summary}"
          echo "report=${report}"
          echo "json=${json}"
        } >> "$GITHUB_OUTPUT"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        if [ "$breaking" -gt 0 ]; then
          jq -r '.breaking[] | "::error title=Breaking change::\(.relation).\(.column) is removed but \(.breaks | join(", ")) still reads it"' "$json"
        fi

    - name: Run the gate
      id: gate
      if: inputs.gate == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BASE: ${{ inputs.base }}
        BASE_REF: ${{ github.base_ref }}
        REPORT: ${{ steps.diff.outputs.report }}
      run: |
        base="$INPUT_BASE"
        if [ -z "$base" ] && [ -n "$BASE_REF" ]; then
          base="origin/${BASE_REF}"
        fi
        json="${RUNNER_TEMP}/konstruct-gate.json"
        rm -f "$json"
        # The graph was built in the step before, with `build-args`; the gate uses it as it is.
        set +e
        konstruct gate ${base:+--base "$base"} --no-update --format markdown --json-file "$json" -q > "${RUNNER_TEMP}/konstruct-gate.md"
        set -e
        if [ ! -f "$json" ]; then
          echo "::error::konstruct gate failed to run"
          cat "${RUNNER_TEMP}/konstruct-gate.md"
          exit 1
        fi
        { echo; cat "${RUNNER_TEMP}/konstruct-gate.md"; } >> "$REPORT"
        { echo; cat "${RUNNER_TEMP}/konstruct-gate.md"; } >> "$GITHUB_STEP_SUMMARY"
        if [ "$(jq -r '.passed' "$json")" = "true" ]; then
          echo "gate=passed" >> "$GITHUB_OUTPUT"
        else
          echo "gate=failed" >> "$GITHUB_OUTPUT"
          # Annotation paths are relative to the repository, the findings' to the working directory.
          prefix="$(git rev-parse --show-prefix 2>/dev/null || true)"
          jq -r --arg prefix "$prefix" '
            def data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def property: data | gsub(":"; "%3A") | gsub(","; "%2C");
            .findings[]
            | "::error title=\("Gate " + .rule | property)\(if .path then ",file=" + ($prefix + .path | property) else "" end)::\(.message + ". " + .fix | data)"
          ' "$json"
        fi

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPORT: ${{ steps.diff.outputs.report }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        marker="<!-- konstruct-lineage-review -->"
        body="$(printf '%s\n\n%s\n' "$marker" "$(cat "$REPORT")")"
        existing=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
          --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id // empty")
        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$body" > /dev/null
        else
          gh api --method POST "repos/${REPO}/issues/${PR}/comments" -f body="$body" > /dev/null
        fi

    - name: Fail on the gate
      if: inputs.gate == 'true' && steps.gate.outputs.gate == 'failed'
      shell: bash
      run: |
        echo "::error::The gate failed; see the job summary or the pull request comment."
        exit 1

    - name: Fail on breaking changes
      if: inputs.fail-on-breaking == 'true' && steps.diff.outputs.breaking != '0'
      shell: bash
      env:
        BREAKING: ${{ steps.diff.outputs.breaking }}
      run: |
        echo "::error::${BREAKING} breaking change(s); see the job summary or the pull request comment."
        exit 1
