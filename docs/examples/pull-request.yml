# konstruct on pull requests: comments with what the change does to the data stack, column by
# column, and fails when it removes a column that something downstream still reads.
#
# Copy to .github/workflows/konstruct.yml in a dbt or SQL repository. `dbt parse` gives konstruct the
# manifest it needs to resolve ref() and source(); it needs a profile but no warehouse connection.
# Replace dbt-duckdb with your adapter, and drop the dbt step if the repository has no dbt project.
name: konstruct

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3

      # Installing konstruct from source compiles its Rust core.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install konstruct and dbt
        run: |
          uv tool install git+https://github.com/kodexlabsio/konstruct
          uv tool install dbt-core --with dbt-duckdb

      - name: Parse the dbt project
        run: dbt parse --quiet

      - name: Build the graph
        run: konstruct build --no-warehouse

      - name: Compare with the base branch
        run: konstruct diff --base "origin/${{ github.base_ref }}" --format markdown -q > konstruct.md

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file konstruct.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file konstruct.md

      - name: Fail on breaking changes
        run: konstruct diff --base "origin/${{ github.base_ref }}" --fail-on-breaking -q > /dev/null

      # Optional: the stricter check an agent passes before opening a pull request.
      - name: Gate
        run: konstruct gate --base "origin/${{ github.base_ref }}" --no-update -q
